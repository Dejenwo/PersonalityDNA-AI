# Local development stack. Not a production deployment.
# Usage: cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pdna}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdna}"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: services/backend/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment:
      PDNA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pdna}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pdna}
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: services/backend/Dockerfile }
    environment:
      PDNA_ENVIRONMENT: development
      PDNA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pdna}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pdna}
      PDNA_CORS_ORIGINS: '["http://localhost:3000"]'
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000", NEXT_PUBLIC_SITE_URL: "http://localhost:3000" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
