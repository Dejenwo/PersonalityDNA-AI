[project]
name = "personality-dna-backend"
version = "0.1.0"
description = "PersonalityDNA AI backend (modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "uvicorn[standard]>=0.32",
  "psycopg[binary]>=3.2,<4",
  "pyjwt>=2.10,<3",
  "argon2-cffi>=23.1",
  "email-validator>=2.2,<3",
  "anthropic>=2.14,<3",
  "cryptography>=44",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.13", "ruff>=0.8", "mypy>=1.13", "types-reportlab>=4.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]
