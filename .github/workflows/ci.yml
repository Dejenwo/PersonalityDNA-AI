name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests on PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdna
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pdna_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pdna" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        run: pytest
        env:
          PDNA_TEST_DATABASE_URL: postgresql+psycopg://pdna:ci-only-password@localhost:5432/pdna_test
      - name: OpenAPI contract is current
        run: python scripts/export_openapi.py --check
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit --skip-editable

  web:
    name: Web and packages (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are current
        run: pnpm --filter @pdna/api-client exec openapi-typescript openapi.json --check -o src/schema.d.ts
      - run: pnpm -r typecheck
      - run: pnpm --filter @pdna/web lint
      - run: pnpm --filter @pdna/design-tokens test
      - run: pnpm --filter @pdna/web test
      - run: pnpm --filter @pdna/web build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

  e2e:
    name: End-to-end and accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    needs: [backend, web]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - run: pip install -e "services/backend[dev]"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pdna/web build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      - run: pnpm --filter @pdna/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @pdna/e2e test
        env:
          E2E_TMP: ${{ runner.temp }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner
